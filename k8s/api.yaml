apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: qazprocure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: qazprocure:local
          args: ["api"]
          ports:
            - containerPort: 8765
          envFrom:
            - configMapRef:
                name: qazprocure-config
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8765
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: secrets
          secret:
            secretName: qazprocure-secrets
            items:
              - key: postgres_password
                path: postgres_password
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: qazprocure
spec:
  selector:
    app: api
  ports:
    - port: 8765
      targetPort: 8765
  type: ClusterIP
