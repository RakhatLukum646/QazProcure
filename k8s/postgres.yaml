apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: qazprocure
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: qazprocure
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-bookworm
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: qazprocure-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: qazprocure-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres_password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "qazprocure", "-d", "qazprocure"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "qazprocure", "-d", "qazprocure"]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: secrets
          secret:
            secretName: qazprocure-secrets
            items:
              - key: postgres_password
                path: postgres_password
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: qazprocure
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
