apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: qazprocure
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: qazprocure:local
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: qazprocure-config
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: secrets
          secret:
            secretName: qazprocure-secrets
        - name: data
          emptyDir: {}
